buildings:
  - role: warehouse
    name: Warehouse
    id: warehouse
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
        capabilities:
          storage:
            - storageType: any
              amount: 100
      - details:
          level: 2
          timeToUpdateInSeconds: 30
          requirements:
            - resourceId: wood
              cost: 20
        capabilities:
          storage:
            - storageType: any
              amount: 200
  - role: resource
    name: Coal Mine
    id: coal_mine
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
          requirements:
            - resourceId: wood
              cost: 20
        capabilities:
          production:
            - resourceId: coal
              amount: 1
              interval: 1
      - details:
          level: 2
          timeToUpdateInSeconds: 30
          requirements:
            - resourceId: wood
              cost: 100
        capabilities:
          production:
            - resourceId: coal
              amount: 3
              interval: 1
      - details:
          level: 3
          timeToUpdateInSeconds: 60
          requirements:
            - resourceId: wood
              cost: 300
            - resourceId: stone_granite
              cost: 50
        capabilities:
          production:
            - resourceId: coal
              amount: 4
              interval: 1
      - details:
          level: 4
          timeToUpdateInSeconds: 80
        capabilities:
          production:
            - resourceId: coal
              amount: 5
              interval: 1
  - role: resource
    name: Lumber mill
    id: lumber_mill
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
          requirements:
            - resourceId: wood
              cost: 10
        capabilities:
          production:
            - resourceId: wood
              amount: 1
              interval: 1
      - details:
          level: 2
          timeToUpdateInSeconds: 30
          requirements:
            - resourceId: wood
              cost: 50
        capabilities:
          production:
            - resourceId: wood
              amount: 1
              interval: 1
      - details:
          level: 3
          timeToUpdateInSeconds: 60
          requirements:
            - resourceId: wood
              cost: 300
        capabilities:
          production:
            - resourceId: wood
              amount: 1
              interval: 1
      - details:
          level: 4
          timeToUpdateInSeconds: 80
          requirements:
            - resourceId: wood
              cost: 500
            - resourceId: stone_granite
              cost: 50
        capabilities:
          production:
            - resourceId: wood
              amount: 1
              interval: 1
  - role: technology
    name: University of Nothingness
    id: university
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
      - details:
          level: 2
          timeToUpdateInSeconds: 30
      - details:
          level: 3
          timeToUpdateInSeconds: 60
      - details:
          level: 4
          timeToUpdateInSeconds: 80
  - role: unit
    name: Train factory
    id: train_factory
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
      - details:
          level: 2
          timeToUpdateInSeconds: 30
          requirements:
            - researchNodeId: basic_metallurgy
              researchNodeLevel: 1
      - details:
          level: 3
          timeToUpdateInSeconds: 60
          requirements:
            - researchNodeId: basic_metallurgy
              researchNodeLevel: 2
      - details:
          level: 4
          timeToUpdateInSeconds: 80
          requirements:
            - buildingId: university
              buildingLevel: 2
  - role: technology
    name: Really expensive building
    id: expensive_building
    buildingDetailsAtCertainLevel:
      - details:
          level: 1
          timeToUpdateInSeconds: 10
          requirements:
            - resourceId: wood
              cost: 999999
